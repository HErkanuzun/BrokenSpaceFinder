name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat ci

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/package.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrokenSpaceFinder
          path: bin/BrokenSpaceFinder.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BrokenSpaceFinder-*-Setup.exe
            dist/BrokenSpaceFinder-*-Portable.zip
            dist/SHA256SUMS.txt
